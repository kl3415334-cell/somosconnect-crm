<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#002b55" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <!-- Central emblem: 2 connected holding hands / infinity unity heart representing Somos Uno -->
  <g transform="translate(256, 256) scale(0.85)">
    <!-- Outer ring of unity -->
    <circle cx="0" cy="0" r="170" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="8" stroke-dasharray="16 12"/>
    
    <!-- Central People/Hearts connecting -->
    <path d="M-90,-50 C-90,-110 -20,-110 0,-40 C20,-110 90,-110 90,-50 C90,30 0,110 0,110 C0,110 -90,30 -90,-50 Z" 
          fill="none" stroke="url(#glowGrad)" stroke-width="24" stroke-linejoin="round" stroke-linecap="round"/>
    
    <!-- Central Node of Connection -->
    <circle cx="0" cy="-35" r="28" fill="#ffffff" />
    <circle cx="-55" cy="-35" r="18" fill="#38bdf8" />
    <circle cx="55" cy="-35" r="18" fill="#38bdf8" />
    
    <!-- Bridge of Unity -->
    <path d="M-80,60 C-40,85 40,85 80,60" fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round" />
  </g>
  <text x="256" y="445" font-family="'Plus Jakarta Sans', sans-serif" font-size="34" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="4">SOMOS UNO</text>
</svg>
